<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khung Ảnh Gia Đình</title>
    <!-- iOS Web App full screen meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Khung Ảnh">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
        }
        #stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center center;
            opacity: 0;
            -webkit-transition: opacity 1.8s ease-in-out, -webkit-transform 8s ease-out;
            transition: opacity 1.8s ease-in-out, transform 8s ease-out;
            -webkit-transform: scale(1.0);
            transform: scale(1.0);
        }
        .slide.active {
            opacity: 1;
            -webkit-transform: scale(1.06);
            transform: scale(1.06);
            z-index: 2;
        }
        .slide.previous {
            opacity: 0;
            z-index: 1;
        }
        /* Smart Clock Overlay */
        #hud {
            position: absolute;
            bottom: 25px;
            left: 25px;
            z-index: 10;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.85), 0 1px 3px rgba(0,0,0,0.9);
            pointer-events: none;
            -webkit-transition: opacity 0.5s;
            transition: opacity 0.5s;
        }
        #time {
            font-size: 56px;
            font-weight: 200;
            letter-spacing: 1px;
            line-height: 1;
        }
        #date {
            font-size: 19px;
            font-weight: 300;
            margin-top: 6px;
            opacity: 0.95;
            letter-spacing: 0.5px;
        }
        #photo-count {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 10;
            color: rgba(255,255,255,0.7);
            font-size: 15px;
            font-weight: 300;
            text-shadow: 0 1px 6px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        /* Hidden control hints */
        #controls {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: -webkit-flex;
            display: flex;
        }
        .tap-zone {
            height: 100%;
        }
        #prev-zone { width: 30%; }
        #play-zone { width: 40%; }
        #next-zone { width: 30%; }
        #indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            -webkit-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
            color: #fff;
            background: rgba(0,0,0,0.55);
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 16px;
            z-index: 20;
            opacity: 0;
            -webkit-transition: opacity 0.3s;
            transition: opacity 0.3s;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="stage">
        <div id="slideA" class="slide"></div>
        <div id="slideB" class="slide"></div>
    </div>

    <div id="hud">
        <div id="time">--:--</div>
        <div id="date">Đang tải ảnh...</div>
    </div>

    <div id="photo-count"></div>
    <div id="indicator"></div>

    <div id="controls">
        <div id="prev-zone" class="tap-zone"></div>
        <div id="play-zone" class="tap-zone"></div>
        <div id="next-zone" class="tap-zone"></div>
    </div>

    var currentIndex = 0;
    var isPaused = false;
    var slideDuration = 8000; // 8 seconds per photo
    var timer = null;
    var activeSlot = 'A';

    var slideA = document.getElementById('slideA');
    var slideB = document.getElementById('slideB');
    var timeElem = document.getElementById('time');
    var dateElem = document.getElementById('date');
    var countElem = document.getElementById('photo-count');
    var indicatorElem = document.getElementById('indicator');

    // Shuffle photos array on launch
    function shuffle(array) {
        for (var i = array.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var temp = array[i];
            array[i] = array[j];
            array[j] = temp;
        }
    }
    shuffle(photos);

    function showFlash(text) {
        indicatorElem.innerHTML = text;
        indicatorElem.style.opacity = '1';
        setTimeout(function() {
            indicatorElem.style.opacity = '0';
        }, 1200);
    }

    function updateClock() {
        var now = new Date();
        var h = ('0' + now.getHours()).slice(-2);
        var m = ('0' + now.getMinutes()).slice(-2);
        timeElem.innerHTML = h + ':' + m;

        var days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
        var months = ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6', 'Tháng 7', 'Tháng 8', 'Tháng 9', 'Tháng 10', 'Tháng 11', 'Tháng 12'];
        dateElem.innerHTML = days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()];
    }
    setInterval(updateClock, 1000);
    updateClock();

    function preload(url) {
        var img = new Image();
        img.src = url;
    }

    function showPhoto(index) {
        if (index < 0) index = photos.length - 1;
        if (index >= photos.length) index = 0;
        currentIndex = index;

        var currentUrl = photos[currentIndex];
        countElem.innerHTML = (currentIndex + 1) + ' / ' + photos.length;

        // Alternate between slot A and slot B for smooth crossfade
        var nextSlot = (activeSlot === 'A') ? 'B' : 'A';
        var currentElem = (activeSlot === 'A') ? slideA : slideB;
        var nextElem = (nextSlot === 'A') ? slideA : slideB;

        nextElem.style.backgroundImage = 'url("' + currentUrl + '")';
        nextElem.className = 'slide active';
        currentElem.className = 'slide previous';

        activeSlot = nextSlot;

        // Preload next 2 images
        preload(photos[(currentIndex + 1) % photos.length]);
        preload(photos[(currentIndex + 2) % photos.length]);
    }

    function nextPhoto() {
        showPhoto(currentIndex + 1);
    }

    function prevPhoto() {
        showPhoto(currentIndex - 1);
    }

    function startTimer() {
        clearInterval(timer);
        timer = setInterval(function() {
            if (!isPaused) {
                nextPhoto();
            }
        }, slideDuration);
    }

    // Touch controls for iPad
    document.getElementById('next-zone').addEventListener('click', function() {
        nextPhoto();
        startTimer();
    });

    document.getElementById('prev-zone').addEventListener('click', function() {
        prevPhoto();
        startTimer();
    });

    document.getElementById('play-zone').addEventListener('click', function() {
        isPaused = !isPaused;
        showFlash(isPaused ? '❚❚ Tạm dừng' : '▶ Tiếp tục');
    });

    // Start show
    showPhoto(0);
    startTimer();
    </script>
